# Source Registry — single source of truth for available sources.
# Schema:
#   id: string                         (matches AdapterBase.name)
#   tier: ready | one_step
#   adapter: python.dotted.path        (importable AdapterBase subclass)
#   description: human label (zh)
#   query_hints: [str]                 (router weights these queries toward this source)
#   default_in_auto: bool              (included in auto fanout when ready)
#   deps:
#     auto: [{kind: pipx|npm|pip, name: str}]
#     manual: [{step: str, verify: str}]

- id: web
  tier: ready
  adapter: deuseek.adapters.web.WebSearchAdapter
  description: 通用网页搜索 (DuckDuckGo)
  query_hints: []
  default_in_auto: true
  trust: 0.80
  timeout_seconds: 15
  deps: { auto: [], manual: [] }

- id: hackernews
  tier: ready
  adapter: deuseek.adapters.hackernews.HackerNewsAdapter
  description: HackerNews 全文搜索
  query_hints: [hn, hackernews, "show hn"]
  default_in_auto: true
  trust: 0.85
  timeout_seconds: 10
  deps: { auto: [], manual: [] }

- id: youtube
  tier: ready
  adapter: deuseek.adapters.youtube.YouTubeAdapter
  description: YouTube 视频搜索 + 字幕提取
  query_hints: [youtube, "video", "视频", "教程"]
  default_in_auto: true
  trust: 0.60
  timeout_seconds: 20
  deps: { auto: [], manual: [] }

- id: github
  tier: ready
  adapter: deuseek.adapters.github.GitHubAdapter
  description: GitHub 仓库/Issue/Discussion 搜索
  query_hints: [github, repo, issue, "源码"]
  default_in_auto: true
  trust: 0.90
  timeout_seconds: 15
  deps: { auto: [], manual: [] }

- id: rss
  tier: ready
  adapter: deuseek.adapters.rss.RssAdapter
  description: RSS / Atom 源阅读
  query_hints: [rss, atom, feed, "订阅"]
  default_in_auto: false
  trust: 0.75
  timeout_seconds: 15
  deps: { auto: [], manual: [] }

- id: wechat
  tier: ready
  adapter: deuseek.adapters.wechat.WeChatAdapter
  description: 微信公众号搜索 (Sogou 免费)
  query_hints: [微信, 公众号, wechat]
  default_in_auto: false
  trust: 0.55
  timeout_seconds: 20
  deps: { auto: [], manual: [] }

- id: bilibili
  tier: ready
  adapter: deuseek.adapters.bilibili.BilibiliAdapter
  description: B站视频/笔记搜索 (B站官方 API)
  query_hints: [b站, bilibili, 哔哩哔哩]
  default_in_auto: false
  trust: 0.60
  timeout_seconds: 15
  deps: { auto: [], manual: [] }

- id: reddit
  tier: one_step
  adapter: deuseek.adapters.reddit.RedditAdapter
  description: Reddit 帖子 + 评论搜索 (需要 rdt-cli 登录)
  query_hints: [reddit, "r/", subreddit]
  default_in_auto: false
  trust: 0.70
  timeout_seconds: 20
  deps:
    auto:
      - { kind: npm, name: rdt-cli }
    manual:
      - { step: "在浏览器完成 Reddit OAuth — 运行 `rdt login` 并按提示授权" }
